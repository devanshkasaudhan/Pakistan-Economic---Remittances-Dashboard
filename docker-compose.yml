version: '3.8'

services:
  ml-api-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://ml-api-service:8000
    depends_on:
      - ml-api-service
